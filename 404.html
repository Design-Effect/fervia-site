<title>Page introuvable · Fervia</title>
<meta name="theme-color" content="#1A2D45">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  :root{
    --navy:#1A2D45;
    --navy-deep:#0E1C30;
    --or:#C9A84C;
    --or-light:#F5D27A;
    --or-deep:#A8792A;
    --creme:#F5F0E6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;min-height:100svh;
    display:flex;align-items:center;justify-content:center;
    background:var(--navy-deep);color:var(--creme);
    font-family:Georgia,'Times New Roman',serif;
    text-align:center;padding:24px;
  }
  .box{max-width:520px;}
  .flame{height:74px;width:auto;margin:0 auto 26px;display:block;}
  h1{font-weight:400;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.2;margin-bottom:14px;}
  h1 .gold{color:var(--or);font-style:italic;}
  p{font-family:system-ui,sans-serif;font-weight:300;font-size:.98rem;line-height:1.65;opacity:.82;margin-bottom:30px;}
  .btn{
    display:inline-block;padding:13px 30px;border-radius:3px;
    font-family:system-ui,sans-serif;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;
    text-decoration:none;color:var(--navy-deep);
    background:linear-gradient(135deg,var(--or-light),var(--or-deep));
    transition:box-shadow .3s,transform .3s;
  }
  .btn:hover{box-shadow:0 10px 22px -10px rgba(201,168,76,.6);transform:translateY(-2px);}
  :focus-visible{outline:2px solid var(--or);outline-offset:3px;border-radius:2px}
  .btn:active{transform:scale(.97);transition:transform .16s cubic-bezier(.22,.61,.36,1)}
  @media (hover:none){.btn:hover{transform:none}}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .btn:hover,.btn:active{transform:none}
  }
</style>
</head>
